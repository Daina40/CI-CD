name: CICD Pipeline

on: 
  push: 
    branches:
      - main


jobs:
  Test: 
    runs-on: ubuntu_latest

    steps: 
      - name: Git Clone
        uses: actions/checkout@v7
      
      - name: install node js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      
      - name: Install Packages
        run: npm install
      
      - name: Run the Test
        run: npm run test
      
      - name: Print the Hello.txt file
        run: cat hello.txt
        
          